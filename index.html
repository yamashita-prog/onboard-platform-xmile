<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Onboard — 内定者プラットフォーム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Sans:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef6fb;
  --s1:#ffffff;
  --s2:#f0f7fc;
  --s3:#daeef8;
  --border:#c8e2f0;
  --text:#0f2a3d;
  --text2:#4a7190;
  --text3:#90b8cc;
  --accent:#1a7fbf;
  --accent2:#0d5a8a;
  --green:#10b981;
  --red:#ef4444;
  --yellow:#f59e0b;
  --purple:#7c3aed;
  --radius:14px;
  --shadow:0 2px 12px rgba(26,127,191,0.10);
  --shadow2:0 4px 24px rgba(26,127,191,0.16);
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
#topbar{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(26,127,191,0.25)}
#topbar .logo{font-size:20px;font-weight:900;letter-spacing:-0.5px}
#topbar .logo span{opacity:.7;font-weight:400}
#mode-toggle{display:flex;gap:6px}
#mode-toggle button{padding:5px 14px;border:1.5px solid rgba(255,255,255,0.5);background:transparent;color:#fff;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
#mode-toggle button.active{background:#fff;color:var(--accent)}
#hamburger{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px}

/* ── LAYOUT ── */
#layout{display:flex;flex:1;min-height:calc(100vh - 56px)}
#sidebar{width:220px;background:var(--s1);border-right:1.5px solid var(--border);padding:20px 0;display:flex;flex-direction:column;gap:2px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;transition:transform .3s}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 22px;border-radius:0 10px 10px 0;margin-right:12px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);transition:all .2s;border:none;background:none;width:calc(100% - 12px);text-align:left;font-family:inherit}
.nav-item:hover{background:var(--s2);color:var(--accent)}
.nav-item.active{background:var(--s3);color:var(--accent);font-weight:700}
.nav-section{font-size:10px;font-weight:700;color:var(--text3);padding:16px 22px 6px;letter-spacing:.08em;text-transform:uppercase}
#main{flex:1;padding:28px;overflow-y:auto;max-width:100%}

/* ── CARDS ── */
.card{background:var(--s1);border-radius:var(--radius);border:1.5px solid var(--border);padding:22px;box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.stat-card{background:var(--s1);border-radius:var(--radius);border:1.5px solid var(--border);padding:20px;text-align:center}
.stat-num{font-size:32px;font-weight:900;color:var(--accent)}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}

/* ── BUTTONS ── */
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{background:var(--red);color:#fff}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 14px;background:var(--s2);color:var(--text2);font-weight:700;text-align:left;border-bottom:1.5px solid var(--border)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--s2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-green{background:#d1fae5;color:#065f46}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-purple{background:#ede9fe;color:#5b21b6}

/* ── MODAL ── */
.modal{display:none;position:fixed;inset:0;background:rgba(15,42,61,0.4);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:var(--radius);padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2)}
.modal-title{font-size:17px;font-weight:900;margin-bottom:20px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none;transition:border .2s;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ── PROGRESS / XP ── */
.xp-bar-wrap{background:var(--s3);border-radius:20px;height:10px;overflow:hidden}
.xp-bar{background:linear-gradient(90deg,var(--accent),#38bdf8);height:100%;border-radius:20px;transition:width .6s}

/* ── CHAT ── */
.chat-area{display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:320px;overflow-y:auto;padding:12px;background:var(--s2);border-radius:10px;margin-bottom:12px}
.chat-msg{display:flex;flex-direction:column;max-width:75%}
.chat-msg.from-us{align-self:flex-end;align-items:flex-end}
.chat-msg.from-them{align-self:flex-start}
.chat-bubble{padding:9px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.from-us .chat-bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.from-them .chat-bubble{background:#fff;border:1.5px solid var(--border);border-bottom-left-radius:4px}
.chat-time{font-size:10px;color:var(--text3);margin-top:3px;padding:0 4px}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.chat-input-row input:focus{border-color:var(--accent)}

/* ── CANDIDATE LIST ── */
.cand-list{display:flex;flex-direction:column;gap:0}
.cand-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.cand-item:last-child{border-bottom:none}
.cand-item:hover{background:var(--s2)}
.cand-item.selected{background:var(--s3)}
.cand-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#38bdf8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;flex-shrink:0}
.cand-info{flex:1;min-width:0}
.cand-name{font-size:14px;font-weight:700}
.cand-preview{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── SCHEDULE ── */
.sched-item{display:flex;align-items:flex-start;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.sched-item:last-child{border-bottom:none}
.sched-date{min-width:56px;text-align:center;background:var(--accent);color:#fff;border-radius:10px;padding:8px 6px;font-weight:900;font-size:13px;line-height:1.3}
.sched-date .month{font-size:10px;font-weight:500;opacity:.85}
.sched-body{flex:1}
.sched-title{font-weight:700;font-size:14px}
.sched-meta{font-size:12px;color:var(--text2);margin-top:3px}
.sched-actions{display:flex;gap:6px;margin-top:8px}

/* ── NEWS ── */
.news-item{padding:14px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-item h4{font-size:14px;font-weight:700;margin-bottom:4px}
.news-item p{font-size:13px;color:var(--text2);line-height:1.5}
.news-date{font-size:11px;color:var(--text3);margin-top:5px}

/* ── MISSION ── */
.mission-item{display:flex;align-items:center;gap:14px;padding:14px;background:var(--s2);border-radius:10px;margin-bottom:10px;border:1.5px solid var(--border)}
.mission-icon{font-size:26px}
.mission-body{flex:1}
.mission-title{font-weight:700;font-size:14px}
.mission-desc{font-size:12px;color:var(--text2);margin-top:2px}
.mission-xp{font-size:12px;font-weight:700;color:var(--accent);margin-top:4px}
.mission-check{font-size:22px;cursor:pointer}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:all .3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── TEAM ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.team-card{background:var(--s2);border:1.5px solid var(--border);border-radius:12px;padding:18px;text-align:center}
.team-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#a78bfa);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;margin:0 auto 10px}
.team-name{font-weight:700;font-size:14px}
.team-role{font-size:12px;color:var(--text2);margin-top:2px}
.team-email{font-size:11px;color:var(--text3);margin-top:4px;word-break:break-all}

/* ── MOBILE ── */
@media(max-width:768px){
  #hamburger{display:block}
  #sidebar{position:fixed;top:56px;left:0;bottom:0;z-index:90;transform:translateX(-100%);box-shadow:var(--shadow2)}
  #sidebar.open{transform:translateX(0)}
  #main{padding:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .tbl{display:block;overflow-x:auto}
  .modal-box{padding:20px}
  .team-grid{grid-template-columns:1fr 1fr}
  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(15,42,61,0.3);z-index:89}
  #sidebar-overlay.open{display:block}
}
@media(max-width:480px){
  .team-grid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">Onboard <span>by X Mile</span></div>
  <div style="display:flex;align-items:center;gap:10px">
    <div id="mode-toggle">
      <button onclick="setMode('admin')" id="btn-admin">管理者</button>
      <button onclick="setMode('candidate')" id="btn-candidate">内定者</button>
    </div>
    <button id="hamburger" onclick="toggleSidebar()">☰</button>
  </div>
</div>
<div id="sidebar-overlay" onclick="closeSidebar()"></div>

<div id="layout">
<!-- SIDEBAR -->
<div id="sidebar">
  <div class="nav-section">メイン</div>
  <button class="nav-item" id="ni-dashboard" onclick="nav('dashboard',this)">🏠 ダッシュボード</button>
  <button class="nav-item" id="ni-candidates" onclick="nav('candidates',this)" style="display:none">👥 内定者管理</button>
  <button class="nav-item" id="ni-team" onclick="nav('team',this)" style="display:none">🧑‍💼 担当者管理</button>
  <div class="nav-section">コンテンツ</div>
  <button class="nav-item" id="ni-schedule" onclick="nav('schedule',this)">📅 入社スケジュール</button>
  <button class="nav-item" id="ni-news" onclick="nav('news',this)">📰 週報・お知らせ</button>
  <button class="nav-item" id="ni-mission" onclick="nav('mission',this)">🎯 入社前ミッション</button>
  <div class="nav-section">コミュニケーション</div>
  <button class="nav-item" id="ni-chat" onclick="nav('chat',this)">💬 メッセージ</button>
  <button class="nav-item" id="ni-contact" onclick="nav('contact',this)" style="display:none">📧 担当者へ連絡</button>
</div>

<!-- MAIN -->
<div id="main">
  <div id="page-content"></div>
</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- ADD CANDIDATE MODAL -->
<div class="modal" id="add-cand-modal" onclick="closeModal('add-cand-modal',event)">
  <div class="modal-box">
    <div class="modal-title">✏️ 内定者を追加</div>
    <div class="form-group"><label>氏名</label><input id="fc-name" placeholder="山田 太郎"></div>
    <div class="form-group"><label>大学・学部</label><input id="fc-univ" placeholder="東京大学 経済学部"></div>
    <div class="form-group"><label>入社予定日</label><input id="fc-join" type="date"></div>
    <div class="form-group"><label>メールアドレス</label><input id="fc-email" type="email" placeholder="taro@example.com"></div>
    <div class="form-group"><label>担当リクルーター</label>
      <select id="fc-recruiter"></select>
    </div>
    <div class="form-group"><label>ステータス</label>
      <select id="fc-status">
        <option value="内定承諾">内定承諾</option>
        <option value="書類提出待ち">書類提出待ち</option>
        <option value="研修待ち">研修待ち</option>
        <option value="入社済み">入社済み</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('add-cand-modal')">キャンセル</button>
      <button class="btn btn-primary" onclick="saveCandidate()">保存</button>
    </div>
  </div>
</div>

<!-- EDIT CANDIDATE MODAL -->
<div class="modal" id="edit-cand-modal" onclick="closeModal('edit-cand-modal',event)">
  <div class="modal-box">
    <div class="modal-title">✏️ 内定者を編集</div>
    <input type="hidden" id="ec-id">
    <div class="form-group"><label>氏名</label><input id="ec-name"></div>
    <div class="form-group"><label>大学・学部</label><input id="ec-univ"></div>
    <div class="form-group"><label>入社予定日</label><input id="ec-join" type="date"></div>
    <div class="form-group"><label>メールアドレス</label><input id="ec-email" type="email"></div>
    <div class="form-group"><label>担当リクルーター</label><select id="ec-recruiter"></select></div>
    <div class="form-group"><label>ステータス</label>
      <select id="ec-status">
        <option value="内定承諾">内定承諾</option>
        <option value="書類提出待ち">書類提出待ち</option>
        <option value="研修待ち">研修待ち</option>
        <option value="入社済み">入社済み</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('edit-cand-modal')">キャンセル</button>
      <button class="btn btn-primary" onclick="updateCandidate()">更新</button>
    </div>
  </div>
</div>

<!-- ADD SCHEDULE MODAL -->
<div class="modal" id="add-sched-modal" onclick="closeModal('add-sched-modal',event)">
  <div class="modal-box">
    <div class="modal-title" id="sched-modal-title">📅 スケジュールを追加</div>
    <input type="hidden" id="fs-id">
    <div class="form-group"><label>タイトル</label><input id="fs-title" placeholder="入社前研修"></div>
    <div class="form-group"><label>日付</label><input id="fs-date" type="date"></div>
    <div class="form-group"><label>時間</label><input id="fs-time" type="time"></div>
    <div class="form-group"><label>場所</label><input id="fs-place" placeholder="本社3F会議室 / Zoom"></div>
    <div class="form-group"><label>カテゴリ</label>
      <select id="fs-category">
        <option value="研修">研修</option>
        <option value="懇親会">懇親会</option>
        <option value="書類提出">書類提出</option>
        <option value="説明会">説明会</option>
        <option value="その他">その他</option>
      </select>
    </div>
    <div class="form-group"><label>詳細メモ</label><textarea id="fs-note" placeholder="任意"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('add-sched-modal')">キャンセル</button>
      <button class="btn btn-primary" id="sched-save-btn" onclick="saveSchedule()">保存</button>
    </div>
  </div>
</div>

<!-- ADD TEAM MODAL -->
<div class="modal" id="add-team-modal" onclick="closeModal('add-team-modal',event)">
  <div class="modal-box">
    <div class="modal-title" id="team-modal-title">🧑‍💼 担当者を追加</div>
    <input type="hidden" id="ft-id">
    <div class="form-group"><label>氏名</label><input id="ft-name" placeholder="田中 花子"></div>
    <div class="form-group"><label>役職</label><input id="ft-role" placeholder="採用担当"></div>
    <div class="form-group"><label>メールアドレス</label><input id="ft-email" placeholder="hanako@example.com"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('add-team-modal')">キャンセル</button>
      <button class="btn btn-primary" onclick="saveTeamMember()">保存</button>
    </div>
  </div>
</div>

<!-- ADD NEWS MODAL -->
<div class="modal" id="add-news-modal" onclick="closeModal('add-news-modal',event)">
  <div class="modal-box">
    <div class="modal-title">📰 お知らせを追加</div>
    <div class="form-group"><label>タイトル</label><input id="fn-title" placeholder="タイトル"></div>
    <div class="form-group"><label>本文</label><textarea id="fn-body" rows="4" placeholder="内容を入力"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('add-news-modal')">キャンセル</button>
      <button class="btn btn-primary" onclick="saveNews()">投稿</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════ DATA ═══════════════════════════
let mode='admin';
let currentPage='dashboard';
let activeCandidateId=null;
let editingSchedId=null;

function loadData(){
  candidates=JSON.parse(localStorage.getItem('ob_candidates')||'null')||[
    {id:1,name:'山田 太郎',univ:'東京大学 経済学部',join:'2025-04-01',email:'yamada@example.com',recruiter:'田中 花子',status:'内定承諾',xp:120,level:2,msgs:[
      {from:'them',text:'こんにちは！よろしくお願いします。',time:'09:00'},
      {from:'us',text:'こちらこそ！入社楽しみにしています🎉',time:'09:05'}
    ]},
    {id:2,name:'佐藤 美咲',univ:'慶應義塾大学 文学部',join:'2025-04-01',email:'sato@example.com',recruiter:'鈴木 一郎',status:'書類提出待ち',xp:60,level:1,msgs:[]},
    {id:3,name:'鈴木 健太',univ:'早稲田大学 理工学部',join:'2025-04-01',email:'suzuki@example.com',recruiter:'田中 花子',status:'研修待ち',xp:200,level:3,msgs:[]}
  ];
  recruiters=JSON.parse(localStorage.getItem('ob_recruiters')||'null')||[
    {id:1,name:'田中 花子',role:'採用担当',email:'tanaka@xmile.jp'},
    {id:2,name:'鈴木 一郎',role:'人事マネージャー',email:'suzuki@xmile.jp'}
  ];
  schedules=JSON.parse(localStorage.getItem('ob_schedules')||'null')||[
    {id:1,title:'入社オリエンテーション',date:'2025-04-01',time:'10:00',place:'本社3F大会議室',category:'研修',note:'スーツ着用'},
    {id:2,title:'内定者懇親会',date:'2025-03-15',time:'18:00',place:'渋谷 〇〇レストラン',category:'懇親会',note:'私服OK'},
    {id:3,title:'書類提出締め切り',date:'2025-02-28',time:'23:59',place:'メール提出',category:'書類提出',note:''}
  ];
  newsList=JSON.parse(localStorage.getItem('ob_news')||'null')||[
    {id:1,title:'入社前研修の詳細が決まりました',body:'4月1日の入社オリエンテーションの詳細をお知らせします。場所は本社3F大会議室、時間は10時〜17時です。昼食はご用意します。',date:'2025-01-20'},
    {id:2,title:'内定者懇親会のご案内',body:'3月15日（土）18時より内定者懇親会を開催します。ぜひご参加ください！',date:'2025-01-10'}
  ];

// ═══════════════════════════ UTILS ═══════════════════════════
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function closeModal(id,e){
  if(!e||e.target===document.getElementById(id))
    document.getElementById(id).classList.remove('open');
}
function openModal(id){document.getElementById(id).classList.add('open')}
function statusBadge(s){
  const map={'内定承諾':'blue','書類提出待ち':'yellow','研修待ち':'purple','入社済み':'green'};
  return `<span class="badge badge-${map[s]||'blue'}">${s}</span>`;
}
function catBadge(c){
  const map={'研修':'blue','懇親会':'green','書類提出':'yellow','説明会':'purple','その他':'red'};
  return `<span class="badge badge-${map[c]||'blue'}">${c}</span>`;
}
function xpToLevel(xp){return Math.floor(xp/100)+1}
function xpPct(xp){return ((xp%100)/100*100).toFixed(0)}
function formatDate(d){if(!d)return '';const dt=new Date(d);return (dt.getMonth()+1)+'月'+dt.getDate()+'日'}
function formatDay(d){if(!d)return '';const dt=new Date(d);return String(dt.getDate()).padStart(2,'0')}
function formatMonth(d){if(!d)return '';const dt=new Date(d);return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]}
function nextId(arr){return arr.length?Math.max(...arr.map(x=>x.id))+1:1}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

// ═══════════════════════════ MODE ═══════════════════════════
function setMode(m){
  mode=m;
  document.getElementById('btn-admin').classList.toggle('active',m==='admin');
  document.getElementById('btn-candidate').classList.toggle('active',m==='candidate');
  const niCands=document.getElementById('ni-candidates');
  const niTeam=document.getElementById('ni-team');
  const niContact=document.getElementById('ni-contact');
  if(m==='admin'){
    niCands.style.display='flex';
    niTeam.style.display='flex';
    niContact.style.display='none';
  } else {
    niCands.style.display='none';
    niTeam.style.display='none';
    niContact.style.display='flex';
  }
  nav('dashboard',document.getElementById('ni-dashboard'));
}

// ═══════════════════════════ NAV ═══════════════════════════
function nav(page,el){
  currentPage=page;
  closeSidebar();
  document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
  if(el)el.classList.add('active');
  const pages={
    dashboard:renderDashboard,
    candidates:renderCandidates,
    team:renderTeam,
    schedule:renderSchedule,
    news:renderNews,
    mission:renderMission,
    chat:renderChat,
    contact:renderContact
  };
  (pages[page]||renderDashboard)();
}

function renderCandidateRows(){

function saveCandidate(){
  const name=document.getElementById('fc-name').value.trim();
  if(!name){alert('氏名を入力してください');return;}
  candidates.push({id:nextId(candidates),name,univ:document.getElementById('fc-univ').value,join:document.getElementById('fc-join').value,email:document.getElementById('fc-email').value,recruiter:document.getElementById('fc-recruiter').value,status:document.getElementById('fc-status').value,xp:0,level:1,msgs:[]});
  saveAll();closeModal('add-cand-modal');renderCandidates();showToast('✅ 内定者を追加しました');
  ['fc-name','fc-univ','fc-join','fc-email'].forEach(id=>document.getElementById(id).value='');
}
function openEditCand(id){
  const c=candidates.find(x=>x.id===id);if(!c)return;
  const recOpts=recruiters.map(r=>`<option value="${r.name}"${r.name===c.recruiter?' selected':''}>${r.name}</option>`).join('');
  document.getElementById('ec-recruiter').innerHTML=recOpts;
  document.getElementById('ec-id').value=id;
  document.getElementById('ec-name').value=c.name;
  document.getElementById('ec-univ').value=c.univ;
  document.getElementById('ec-join').value=c.join;
  document.getElementById('ec-email').value=c.email;
  document.getElementById('ec-status').value=c.status;
  openModal('edit-cand-modal');
}
function updateCandidate(){
  const id=parseInt(document.getElementById('ec-id').value);
  const c=candidates.find(x=>x.id===id);if(!c)return;
  c.name=document.getElementById('ec-name').value;
  c.univ=document.getElementById('ec-univ').value;
  c.join=document.getElementById('ec-join').value;
  c.email=document.getElementById('ec-email').value;
  c.recruiter=document.getElementById('ec-recruiter').value;
  c.status=document.getElementById('ec-status').value;
  saveAll();closeModal('edit-cand-modal');renderCandidates();showToast('✅ 更新しました');
}
function deleteCandidate(id){
  if(!confirm('この内定者を削除しますか？'))return;
  candidates=candidates.filter(x=>x.id!==id);saveAll();renderCandidates();showToast('🗑 削除しました');
}

function openAddSched(){
  editingSchedId=null;
  document.getElementById('sched-modal-title').textContent='📅 スケジュールを追加';
  document.getElementById('sched-save-btn').textContent='保存';
  document.getElementById('fs-id').value='';
  ['fs-title','fs-date','fs-time','fs-place','fs-note'].forEach(id=>document.getElementById(id).value='');
  openModal('add-sched-modal');
}
function openEditSched(id){
  const s=schedules.find(x=>x.id===id);if(!s)return;
  editingSchedId=id;
  document.getElementById('sched-modal-title').textContent='✏️ スケジュールを編集';
  document.getElementById('sched-save-btn').textContent='更新';
  document.getElementById('fs-id').value=id;
  document.getElementById('fs-title').value=s.title;
  document.getElementById('fs-date').value=s.date;
  document.getElementById('fs-time').value=s.time;
  document.getElementById('fs-place').value=s.place;
  document.getElementById('fs-category').value=s.category;
  document.getElementById('fs-note').value=s.note;
  openModal('add-sched-modal');
}
function saveSchedule(){
  const title=document.getElementById('fs-title').value.trim();
  if(!title){alert('タイトルを入力してください');return;}
  const id=document.getElementById('fs-id').value;
  const data={title,date:document.getElementById('fs-date').value,time:document.getElementById('fs-time').value,place:document.getElementById('fs-place').value,category:document.getElementById('fs-category').value,note:document.getElementById('fs-note').value};
  if(id){
    const s=schedules.find(x=>x.id===parseInt(id));
    if(s)Object.assign(s,data);
    showToast('✅ 更新しました');
  } else {
    schedules.push({id:nextId(schedules),...data});
    showToast('✅ スケジュールを追加しました');
  }
  saveAll();closeModal('add-sched-modal');renderSchedule();
}
function deleteSched(id){
  if(!confirm('このスケジュールを削除しますか？'))return;
  schedules=schedules.filter(x=>x.id!==id);saveAll();renderSchedule();showToast('🗑 削除しました');
}

  const ml=document.getElementById('mission-list');if(!ml)return;

    <div class="mission-item" style="${m.done?'opacity:.6':''}">

        <div class="mission-title" style="${m.done?'text-decoration:line-through':''}">${m.title}</div>
        <div class="mission-desc">${m.desc}</div>
        <div class="mission-xp">+${m.xp} XP</div>
      </div>
      <div class="mission-check" onclick="toggleMission(${m.id})">${m.done?'✅':'⬜'}</div>
    </div>`).join('');
}
function toggleMission(id){
  const m=missions.find(x=>x.id===id);if(!m)return;
  const me=candidates[0];
  if(!m.done){me.xp+=m.xp;showToast(`+${m.xp} XP 獲得！`);}else{me.xp=Math.max(0,me.xp-m.xp);}
  m.done=!m.done;me.level=xpToLevel(me.xp);saveAll();renderMission();
}

        <div style="display:flex;min-height:420px">
          <div style="width:220px;border-right:1.5px solid var(--border);overflow-y:auto" class="cand-list" id="cand-list-chat"></div>
          <div style="flex:1;display:flex;flex-direction:column;padding:16px" id="chat-panel">
            <div style="color:var(--text3);font-size:14px;text-align:center;margin:auto">内定者を選んでください</div>
          </div>
        </div>
      </div>`;
    document.getElementById('cand-list-chat').innerHTML=candidates.map(c=>`
      <div class="cand-item${activeCandidateId===c.id?' selected':''}" id="ci-${c.id}" onclick="selectChat(${c.id})">
        <div class="cand-avatar">${c.name.charAt(0)}</div>
        <div class="cand-info">
          <div class="cand-name">${c.name}</div>
          <div class="cand-preview">${c.msgs.length?c.msgs[c.msgs.length-1].text:'メッセージなし'}</div>
        </div>
      </div>`).join('');
    if(activeCandidateId)selectChat(activeCandidateId);
  } else {
    // 内定者モード — 自分のメッセージ一覧
    const me=candidates[0];
    document.getElementById('page-content').innerHTML=`
      <h2 style="font-size:20px;font-weight:900;margin-bottom:20px">💬 担当者とのメッセージ</h2>
      <div class="card" style="display:flex;flex-direction:column">
        <div class="chat-area" id="chat-area-me"></div>
        <div class="chat-input-row">
          <input id="chat-input-me" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendMsgMe()">
          <button class="btn btn-primary" onclick="sendMsgMe()">送信</button>
        </div>
      </div>`;
    const area=document.getElementById('chat-area-me');
    area.innerHTML=me.msgs.length?me.msgs.map(msg=>`<div class="chat-msg ${msg.from==='us'?'from-us':'from-them'}"><div class="chat-bubble">${msg.text}</div><div class="chat-time">${msg.time}</div></div>`).join(''):'<div style="text-align:center;color:var(--text3);font-size:13px;margin:auto">まだメッセージがありません</div>';
    area.scrollTop=area.scrollHeight;
  }
}
function selectChat(id){
  activeCandidateId=id;
  document.querySelectorAll('.cand-item').forEach(el=>el.classList.remove('selected'));
  const el=document.getElementById('ci-'+id);if(el)el.classList.add('selected');
  const c=candidates.find(x=>x.id===id);if(!c)return;
  const panel=document.getElementById('chat-panel');if(!panel)return;
  panel.innerHTML=`
    <div style="font-size:15px;font-weight:700;margin-bottom:12px">${c.name}さん</div>
    <div class="chat-area" id="chat-area"></div>
    <div class="chat-input-row">
      <input id="chat-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button class="btn btn-primary" onclick="sendMsg()">送信</button>
    </div>`;
  const area=document.getElementById('chat-area');
  area.innerHTML=c.msgs.length?c.msgs.map(msg=>`<div class="chat-msg ${msg.from==='us'?'from-us':'from-them'}"><div class="chat-bubble">${msg.text}</div><div class="chat-time">${msg.time}</div></div>`).join(''):'<div style="text-align:center;color:var(--text3);font-size:13px;margin:auto">まだメッセージがありません</div>';
  area.scrollTop=area.scrollHeight;
}
function sendMsg(){
  if(activeCandidateId===null)return;
  const inp=document.getElementById('chat-input');if(!inp||!inp.value.trim())return;
  const c=candidates.find(x=>x.id===activeCandidateId);if(!c)return;
  const now=new Date();
  c.msgs.push({from:'us',text:inp.value.trim(),time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')});
  inp.value='';saveAll();selectChat(activeCandidateId);
}
function sendMsgMe(){
  const me=candidates[0];
  const inp=document.getElementById('chat-input-me');if(!inp||!inp.value.trim())return;
  const now=new Date();
  me.msgs.push({from:'us',text:inp.value.trim(),time:now.getHours()+':'+String(now.getMinutes()).padStart(2,'0')});
  inp.value='';saveAll();renderChat();
}

// ═══════════════════════════ CONTACT (内定者→担当者 Gmail) ═══════════════════════════
function renderContact(){
  const recOpts=recruiters.map(r=>`<option value="${r.email}">${r.name}（${r.role}）</option>`).join('');
  document.getElementById('page-content').innerHTML=`
    <h2 style="font-size:20px;font-weight:900;margin-bottom:20px">📧 担当者へ連絡</h2>
    <div class="card" style="max-width:540px">
      <div class="form-group"><label>送り先担当者</label>
        <select id="msg-to">${recOpts}</select>
      </div>
      <div class="form-group"><label>件名</label>
        <input id="msg-subject" placeholder="例：入社前のご質問について">
      </div>
      <div class="form-group"><label>メッセージ本文</label>
        <textarea id="msg-body" rows="6" placeholder="内容を入力してください..."></textarea>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="sendGmail()">📨 Gmailで送信する</button>
      <div id="send-result" style="margin-top:10px"></div>
    </div>`;
}
function sendGmail(){
  const sel=document.getElementById('msg-to');
  const email=sel.value;
  const subject=encodeURIComponent(document.getElementById('msg-subject').value||'内定者よりご連絡');
  const body=encodeURIComponent(document.getElementById('msg-body').value);
  if(!document.getElementById('msg-body').value.trim()){alert('メッセージを入力してください');return;}
  window.open('https://mail.google.com/mail/?view=cm&to='+email+'&su='+subject+'&body='+body,'_blank');
  document.getElementById('send-result').innerHTML=`<div style="background:#d1fae5;border:1px solid #10b981;border-radius:8px;padding:12px;font-size:13px;color:#065f46;margin-top:8px">✅ Gmailが開きました！「送信」ボタンを押して完了してください。<br><span style="font-size:11px">送信先：${sel.options[sel.selectedIndex].textContent}</span></div>`;
}

// ═══════════════════════════ INIT ═══════════════════════════
setMode('admin');
nav('dashboard',document.getElementById('ni-dashboard'));
</script>
